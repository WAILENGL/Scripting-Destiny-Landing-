              <circle cx="450" cy="450" r="300" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8" />
              
              <!-- 12 Earthly Branch Nodes with Hanzi -->
              <g transform="translate(450, 125)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20" font-weight="600">子</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(612, 168)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">丑</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(732, 288)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">寅</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(775, 450)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20" font-weight="600">卯</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(732, 612)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">辰</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(612, 732)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">巳</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(450, 775)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20" font-weight="600">午</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(288, 732)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">未</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(168, 612)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">申</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(125, 450)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20" font-weight="600">酉</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(168, 288)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">戌</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>
              <g transform="translate(288, 168)"><text text-anchor="middle" dominant-baseline="central" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="20">亥</text><circle cx="0" cy="0" r="16" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8"/></g>

