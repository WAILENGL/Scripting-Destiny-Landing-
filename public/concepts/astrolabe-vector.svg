            <g class="motion-target animate-spin-slow">
              <circle cx="450" cy="450" r="435" fill="none" stroke="var(--svg-gold-muted)" stroke-width="1.2" stroke-dasharray="3, 5" />
              <circle cx="450" cy="450" r="425" fill="none" stroke="var(--svg-gold)" stroke-width="1.8" />
              <circle cx="450" cy="450" r="405" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8" />
              
              <!-- 12 Primary Cardinal Notches -->
              <g stroke="var(--svg-gold)" stroke-width="1.2">
                <line x1="450" y1="20" x2="450" y2="45" />
                <line x1="450" y1="855" x2="450" y2="880" />
                <line x1="20" y1="450" x2="45" y2="450" />
                <line x1="855" y1="450" x2="880" y2="450" />
                <line x1="145" y1="145" x2="162" y2="162" />
                <line x1="755" y1="145" x2="738" y2="162" />
                <line x1="145" y1="755" x2="162" y2="738" />
                <line x1="755" y1="755" x2="738" y2="738" />
              </g>

              <!-- Outer Sexagenary Degree Markers -->
              <circle cx="450" cy="450" r="390" fill="none" stroke="var(--svg-gold-faint)" stroke-width="16" stroke-dasharray="1 8" />
            </g>

            <!-- Middle Ring: 12 Earthly Branches (地支) & 24 Solar Terms (节气) -->
            <g class="motion-target animate-spin-reverse">
