<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 900" width="900" height="900" style="background:#111215;" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="gradGoldAstrolabe" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="var(--svg-gold)" stop-opacity="0.35"/>
                <stop offset="60%" stop-color="var(--svg-gold)" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="var(--svg-gold)" stop-opacity="0"/>
