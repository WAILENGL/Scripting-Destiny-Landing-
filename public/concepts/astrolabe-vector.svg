              <text x="580" y="265" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">乙</text>
              <text x="660" y="375" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">丙</text>
              <text x="660" y="525" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">丁</text>
              <text x="580" y="635" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">戊</text>
              <text x="450" y="678" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16" font-weight="600">己</text>
              <text x="320" y="635" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">庚</text>
              <text x="240" y="525" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">辛</text>
              <text x="240" y="375" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">壬</text>
              <text x="320" y="265" text-anchor="middle" fill="var(--svg-gold)" font-family="var(--font-serif)" font-size="16">癸</text>
            </g>

            <!-- Core Coordinate Hub -->
            <g>
              <line x1="450" y1="180" x2="450" y2="720" stroke="var(--svg-gold-muted)" stroke-width="0.8" stroke-dasharray="3, 6" />
              <line x1="180" y1="450" x2="720" y2="450" stroke="var(--svg-gold-muted)" stroke-width="0.8" stroke-dasharray="3, 6" />
              <circle cx="450" cy="450" r="120" fill="none" stroke="var(--svg-gold)" stroke-width="1.2" />
              <circle cx="450" cy="450" r="75" fill="none" stroke="var(--svg-gold-muted)" stroke-width="0.8" />
              <circle cx="450" cy="450" r="30" fill="none" stroke="var(--svg-gold)" stroke-width="1.5" />
              <circle cx="450" cy="450" r="6" fill="var(--svg-gold)" />

