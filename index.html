<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scripting Destiny — Know your nature. Time your moves.</title>
    <meta name="description" content="Enter your birth date and discover your BaZi Day Master: your natural strengths, element balance and the 10-year cycles that shape your best timing." />
    <meta name="theme-color" content="#131417" id="theme-color-meta" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PH70NM11Q5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-PH70NM11Q5');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get("theme");
          var saved = urlTheme || localStorage.getItem("sd-theme");
          var theme = saved === "light" ? "light" : "dark";
          var root = document.documentElement;
          var meta = document.getElementById("theme-color-meta");
          if (theme === "light") {
            root.classList.remove("dark");
            root.classList.add("light");
            root.style.colorScheme = "light";
            if (meta) meta.setAttribute("content", "#fbf9f4");
          } else {
            root.classList.add("dark");
            root.classList.remove("light");
            root.style.colorScheme = "dark";
            if (meta) meta.setAttribute("content", "#131417");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
